<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云音 · 网页音乐播放器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- ============ 顶栏 ============ -->
    <header class="topbar">
      <div class="logo">
        <svg viewBox="0 0 24 24" class="logo-icon"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/></svg>
        <span>云音</span>
        <em>纯前端 · 本地音源</em>
      </div>
      <div class="topbar-right">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" fill="currentColor"/></svg>
          <input id="search" type="text" placeholder="搜索标题 / 艺术家" autocomplete="off">
        </div>
        <button id="btn-theme" class="icon-btn" title="切换深浅主题">
          <svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5l2.4 2.4h3.2v3.2L20 10l-2.4 2.4v3.2h-3.2L12 18l-2.4-2.4H6.4v-3.2L4 10l2.4-2.4V4.4h3.2L12 2z" fill="currentColor" transform="rotate(45 12 10)"/></svg>
        </button>
      </div>
    </header>

    <!-- ============ 主区 ============ -->
    <main class="main">
      <!-- 左：正在播放 -->
      <section class="now-playing glass">
        <div class="disc-area">
          <div id="disc" class="disc">
            <div class="disc-core">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/></svg>
            </div>
          </div>
        </div>

        <div class="np-meta">
          <div id="np-title" class="np-title">未在播放</div>
          <div id="np-artist" class="np-artist">导入歌曲开始享受吧</div>
        </div>

        <canvas id="visualizer" class="visualizer"></canvas>

        <div id="lrc-panel" class="lrc-panel">
          <div id="lrc-inner" class="lrc-inner"></div>
        </div>
      </section>

      <!-- 右：播放列表 -->
      <aside class="playlist-panel glass">
        <div class="panel-head">
          <span>播放列表 <b id="list-count">0</b></span>
          <button id="btn-clear" class="text-btn" title="清空列表">清空</button>
        </div>
        <ul id="track-list" class="track-list"></ul>
      </aside>
    </main>

    <!-- ============ 底部控制栏 ============ -->
    <footer class="control-bar glass">
      <div class="progress-row">
        <span id="time-cur" class="time">00:00</span>
        <div id="progress" class="progress" title="点击或拖拽跳转">
          <div id="progress-fill" class="progress-fill">
            <div id="progress-thumb" class="progress-thumb"></div>
          </div>
        </div>
        <span id="time-total" class="time">00:00</span>
      </div>

      <div class="buttons-row">
        <button id="btn-mode" class="icon-btn" title="播放模式"></button>
        <button id="btn-prev" class="icon-btn" title="上一首 (P)">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" fill="currentColor"/></svg>
        </button>
        <button id="btn-play" class="play-btn" title="播放/暂停 (空格)">
          <svg viewBox="0 0 24 24"><path d="M8 5.14v13.72L19 12 8 5.14z" fill="currentColor"/></svg>
        </button>
        <button id="btn-next" class="icon-btn" title="下一首 (N)">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" fill="currentColor"/></svg>
        </button>
        <button id="btn-mute" class="icon-btn" title="静音"></button>
        <input id="volume" class="volume" type="range" min="0" max="100" value="100" title="音量 (↑↓)">
        <button id="btn-import" class="import-btn" title="导入本地音频（可多选）">
          <svg viewBox="0 0 24 24"><path d="M19 13v5H5v-5H3v7h18v-7h-2zm-8-1l-4-4h3V3h2v5h3l-4 4z" fill="currentColor"/></svg>
          <span>导入</span>
        </button>
      </div>
    </footer>
  </div>

  <input id="file-input" type="file" multiple hidden
         accept="audio/*,.mp3,.flac,.m4a,.aac,.ogg,.wav,.opus,.lrc">

  <div id="drop-overlay" class="drop-overlay">
    <div class="drop-card">🎵 松开鼠标，添加到播放列表</div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/model.js"></script>
  <script src="js/lrc.js"></script>
  <script src="js/playlist.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/player.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
